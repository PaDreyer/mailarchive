[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailarchive"
version = "0.1.0"
description = "Local, rule-based email archiving for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "msal>=1.34,<2",
  "Pillow>=10,<13",
  "pystray>=0.19,<0.20",
  "keyring>=25,<27; sys_platform != 'win32'",
]

[project.optional-dependencies]
linux = [
  "PyGObject>=3.48,<3.50",
]

[project.gui-scripts]
mailarchive = "mailarchive.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
