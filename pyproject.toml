[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mailarchive"
version = "1.0.0"
description = "Local, rule-based email archiving for Windows and Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "msal>=1.34,<2",
  "Pillow>=10,<13",
  "pystray>=0.19,<0.20",
  "keyring>=25,<27; sys_platform != 'win32'",
]

[project.optional-dependencies]
linux = [
  "PyGObject>=3.48,<3.50",
]
test = [
  "coverage[toml]>=7.6,<8",
]
quality = [
  "ruff>=0.16,<0.17",
]

[project.gui-scripts]
mailarchive = "mailarchive.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["mailarchive"]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15
