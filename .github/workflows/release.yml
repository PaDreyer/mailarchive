name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="$(PYTHONPATH=src python -c 'import mailarchive; print(mailarchive.__version__)')"
          expected_tag="v${version}"
          if [[ "$package_version" != "$version" ]]; then
            echo "Package version '$package_version' does not match project version '$version'." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match project version '$expected_tag'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create test environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mailarchive-test-venv"
          "$RUNNER_TEMP/mailarchive-test-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/mailarchive-test-venv/bin/python" -m pip install -e .

      - name: Run tests
        shell: bash
        run: |
          "$RUNNER_TEMP/mailarchive-test-venv/bin/python" -m unittest discover -s tests -v

  linux:
    name: Build Linux AppImage
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build in Ubuntu 22.04 container
        shell: bash
        run: ./scripts/build-linux-container.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: MailArchive-${{ needs.verify.outputs.version }}-Linux-x86_64
          path: dist/MailArchive-${{ needs.verify.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows installer
    needs: verify
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build with PyInstaller and Inno Setup
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MailArchive-${{ needs.verify.outputs.version }}-Windows-x64
          path: dist/installer/MailArchive-Setup-${{ needs.verify.outputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs:
      - verify
      - linux
      - windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: MailArchive-${{ needs.verify.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum MailArchive-* > SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "MailArchive $RELEASE_VERSION"
          fi
